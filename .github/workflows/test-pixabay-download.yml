
name: Test Pixabay Video Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Search Pixabay video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e

          curl -fsS --get \
            "https://pixabay.com/api/videos/" \
            --data-urlencode "key=$PIXABAY_API_KEY" \
            --data-urlencode "q=space universe" \
            --data-urlencode "per_page=10" \
            --data-urlencode "safesearch=true" \
            -o pixabay.json

          python - <<'PY'
          import json

          with open("pixabay.json") as f:
              data = json.load(f)

          videos = data.get("hits", [])

          if not videos:
              raise SystemExit("No videos found")

          selected = None
          selected_quality = None

          for video in videos:
              options = video.get("videos", {})
              for quality in ["medium", "small", "large"]:
                  url = options.get(quality, {}).get("url")
                  if url:
                      selected = url
                      selected_quality = quality
                      break
              if selected:
                  break

          if not selected:
              raise SystemExit("No downloadable video URL found")

          with open("video-url.txt", "w") as f:
              f.write(selected)

          print("Video found")
          print("Selected quality:", selected_quality)
          PY

      - name: Download video
        run: |
          set -e

          VIDEO_URL=$(cat video-url.txt)

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 180 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            -e "https://pixabay.com/" \
            "$VIDEO_URL" \
            -o sample.mp4

          test -s sample.mp4

          echo "Download successful"

      - name: Check video
        run: |
          ls -lh sample.mp4

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            sample.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: pixabay-test-video
          path: sample.mp4
