
name: Daily AI YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts requests

      - name: Generate video plan with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          cat > prompt.txt <<'EOF'
          You are a professional YouTube Shorts documentary writer,
          creative director and storytelling expert.

          Independently choose one fascinating, surprising, accurate
          and emotionally engaging topic for an English YouTube Short.

          Topics can include:
          - Strange but true facts
          - Science and nature mysteries
          - Historical events
          - Human psychology
          - Space and the universe
          - Hidden stories behind ordinary things
          - Surprising real-world discoveries

          Avoid generic motivational content and overused topics.

          Write a professional documentary-style narration.

          REQUIREMENTS:
          - Exactly 55 to 65 spoken English words.
          - A powerful opening hook.
          - Natural conversational English.
          - Calm, meaningful and impactful storytelling.
          - Every sentence must add useful information.
          - Build curiosity throughout the narration.
          - A memorable ending.
          - No unnecessary introductions.
          - Avoid unsupported claims.

          Create exactly 5 visual scenes in chronological order.

          Each scene must have a specific Pixabay video search query
          matching its corresponding narration segment.

          Scene queries must:
          - Describe concrete visual subjects and actions.
          - Be suitable for realistic stock footage.
          - Avoid vague or abstract descriptions.
          - Avoid repeating the same visual idea.

          Return ONLY valid JSON:

          {
            "title": "Short title",
            "narration": "Complete narration",
            "scenes": [
              {"query": "specific video search query"},
              {"query": "specific video search query"},
              {"query": "specific video search query"},
              {"query": "specific video search query"},
              {"query": "specific video search query"}
            ]
          }
          EOF

          python - <<'PY'
          import os
          import json
          import time
          import requests

          API_KEY = os.environ["GEMINI_API_KEY"]
          MODEL = "gemini-3.8-flash"

          with open("prompt.txt", encoding="utf-8") as f:
              prompt = f.read()

          url = (
              "https://generativelanguage.googleapis.com/"
              f"v1beta/models/{MODEL}:generateContent"
          )

          payload = {
              "contents": [
                  {"parts": [{"text": prompt}]}
              ],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "temperature": 0.7,
                  "maxOutputTokens": 4096
              }
          }

          session = requests.Session()
          session.headers.update({
              "Content-Type": "application/json",
              "x-goog-api-key": API_KEY
          })

          response = None

          for attempt in range(1, 4):
              try:
                  print(f"Gemini request: attempt {attempt}/3")

                  response = session.post(
                      url,
                      json=payload,
                      timeout=(15, 75)
                  )

                  if response.status_code == 200:
                      break

                  message = response.text[:3000]
                  print("Gemini HTTP status:", response.status_code)

                  if response.status_code in (400, 401, 403):
                      raise RuntimeError(
                          "Gemini rejected the request: " + message
                      )

                  if response.status_code == 429:
                      lower = message.lower()

                      daily_quota = any(term in lower for term in [
                          "per_day",
                          "perday",
                          "daily_limit",
                          "daily quota",
                          "limit: 0"
                      ])

                      if daily_quota:
                          raise RuntimeError(
                              "Gemini daily quota appears exhausted. "
                              "Check Google AI Studio quota."
                          )

                      if attempt == 3:
                          raise RuntimeError(
                              "Gemini rate limit persisted after retries."
                          )

                      wait = 25
                      print(f"Temporary rate limit. Waiting {wait}s.")
                      time.sleep(wait)
                      continue

                  if response.status_code in (500, 502, 503, 504):
                      if attempt == 3:
                          raise RuntimeError(
                              "Gemini server error after 3 attempts: "
                              + message
                          )

                      wait = 8 * attempt
                      print(f"Temporary server error. Waiting {wait}s.")
                      time.sleep(wait)
                      continue

                  response.raise_for_status()

              except requests.exceptions.Timeout:
                  print("Gemini request timed out.")

                  if attempt == 3:
                      raise RuntimeError(
                          "Gemini timed out after 3 attempts."
                      )

                  wait = 8 * attempt
                  print(f"Retrying after {wait}s.")
                  time.sleep(wait)

              except requests.exceptions.ConnectionError as exc:
                  print("Connection problem:", str(exc)[:500])

                  if attempt == 3:
                      raise RuntimeError(
                          "Could not connect to Gemini after 3 attempts."
                      )

                  wait = 8 * attempt
                  time.sleep(wait)

          if response is None or response.status_code != 200:
              raise RuntimeError(
                  "Gemini did not return a successful response."
              )

          try:
              data = response.json()
              parts = data["candidates"][0]["content"]["parts"]

              raw = "".join(
                  part["text"]
                  for part in parts
                  if "text" in part
              )

              result = json.loads(raw)

          except Exception as exc:
              raise RuntimeError(
                  "Could not parse Gemini response: " + str(exc)
              )

          title = result.get("title", "").strip()
          narration = result.get("narration", "").strip()
          scenes = result.get("scenes", [])

          if not title:
              raise RuntimeError("Gemini returned an empty title.")

          if not narration:
              raise RuntimeError("Gemini returned empty narration.")

          word_count = len(narration.split())

          if not 55 <= word_count <= 65:
              raise RuntimeError(
                  f"Narration has {word_count} words; expected 55-65."
              )

          if not isinstance(scenes, list) or len(scenes) != 5:
              raise RuntimeError("Gemini must return exactly 5 scenes.")

          for index, scene in enumerate(scenes, 1):
              if not isinstance(scene, dict):
                  raise RuntimeError(f"Scene {index} is invalid.")

              query = scene.get("query", "").strip()

              if not query:
                  raise RuntimeError(
                      f"Scene {index} has an empty search query."
                  )

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(narration)

          print("Title:", title)
          print("Word count:", word_count)
          print("Scenes:", len(scenes))
          print("Narration generated successfully.")
          PY

      - name: Download relevant Pixabay scenes
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e
          mkdir -p scenes

          python - <<'PY'
          import json
          import os
          import requests
          import time
          import subprocess

          with open("plan.json", encoding="utf-8") as f:
              plan = json.load(f)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://pixabay.com/"
          })

          for i, scene in enumerate(plan["scenes"], 1):
              query = scene["query"]
              print(f"Searching scene {i}: {query}")

              response = session.get(
                  "https://pixabay.com/api/videos/",
                  params={
                      "key": os.environ["PIXABAY_API_KEY"],
                      "q": query,
                      "per_page": 10,
                      "safesearch": "true"
                  },
                  timeout=(20, 45)
              )

              response.raise_for_status()

              videos = response.json().get("hits", [])

              if not videos:
                  raise RuntimeError(
                      f"No Pixabay video found for: {query}"
                  )

              selected = None

              for video in videos:
                  options = video.get("videos", {})

                  for quality in ("medium", "small", "large"):
                      url = options.get(quality, {}).get("url")

                      if url:
                          selected = url
                          break

                  if selected:
                      break

              if not selected:
                  raise RuntimeError(
                      f"No video URL for scene {i}"
                  )

              output = f"scenes/scene{i}.mp4"
              print("Downloading scene", i)

              subprocess.run([
                  "curl",
                  "-fL",
                  "--retry", "2",
                  "--retry-delay", "3",
                  "--connect-timeout", "20",
                  "--max-time", "120",
                  "-A", "Mozilla/5.0",
                  "-e", "https://pixabay.com/",
                  selected,
                  "-o", output
              ], check=True)

              if os.path.getsize(output) < 10000:
                  raise RuntimeError(
                      f"Downloaded scene {i} is too small."
                  )

              time.sleep(2)

          print("All scenes downloaded successfully.")
          PY

      - name: Generate male narration
        run: |
          set -e

          edge-tts \
            --voice en-US-ChristopherNeural \
            --rate=-8% \
            --pitch=-8Hz \
            --file script.txt \
            --write-media voice.mp3 \
            --write-subtitles captions.srt

          test -s voice.mp3
          test -s captions.srt

      - name: Prepare readable subtitles
        run: |
          set -e

          python - <<'PY'
          import re

          def to_ms(value):
              h, m, rest = value.split(":")
              s, ms = rest.split(",")
              return (
                  int(h) * 3600000 +
                  int(m) * 60000 +
                  int(s) * 1000 +
                  int(ms)
              )

          def to_timestamp(ms):
              ms = max(0, ms)
              h = ms // 3600000
              ms %= 3600000
              m = ms // 60000
              ms %= 60000
              s = ms // 1000
              ms %= 1000
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", encoding="utf-8") as f:
              content = f.read().strip()

          blocks = re.split(r"\n\s*\n", content)
          output = []
          counter = 1

          for block in blocks:
              lines = block.strip().splitlines()

              if len(lines) < 3:
                  continue

              match = re.search(
                  r"(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*"
                  r"(\d{2}:\d{2}:\d{2},\d{3})",
                  lines[1]
              )

              if not match:
                  continue

              start = to_ms(match.group(1))
              end = to_ms(match.group(2))
              text = " ".join(lines[2:]).strip()

              if not text or end <= start:
                  continue

              words = text.split()
              chunks = []
              current = []

              for word in words:
                  test = " ".join(current + [word])

                  if len(test) > 30 and current:
                      chunks.append(current)
                      current = [word]
                  else:
                      current.append(word)

              if current:
                  chunks.append(current)

              # Maximum 12 words per caption.
              final_chunks = []

              for chunk in chunks:
                  for i in range(0, len(chunk), 12):
                      final_chunks.append(chunk[i:i+12])

              weights = [len(chunk) for chunk in final_chunks]
              total_weight = sum(weights)
              duration = end - start
              elapsed = 0

              for index, chunk in enumerate(final_chunks):
                  chunk_start = start + elapsed

                  if index == len(final_chunks) - 1:
                      chunk_end = end
                  else:
                      part = round(
                          duration * weights[index] / total_weight
                      )
                      elapsed += part
                      chunk_end = start + elapsed

                  phrase = " ".join(chunk)

                  # Keep each caption to at most two lines.
                  caption_lines = []
                  current_line = ""

                  for word in chunk:
                      candidate = (
                          current_line + " " + word
                      ).strip()

                      if len(candidate) > 30 and current_line:
                          caption_lines.append(current_line)
                          current_line = word
                      else:
                          current_line = candidate

                  if current_line:
                      caption_lines.append(current_line)

                  if len(caption_lines) > 2:
                      raise RuntimeError(
                          "Subtitle exceeded two lines."
                      )

                  output.append(
                      f"{counter}\n"
                      f"{to_timestamp(chunk_start)} --> "
                      f"{to_timestamp(chunk_end)}\n"
                      f"{chr(10).join(caption_lines)}"
                  )

                  counter += 1

          if not output:
              raise RuntimeError("No valid subtitles generated.")

          with open("captions.srt", "w", encoding="utf-8") as f:
              f.write("\n\n".join(output) + "\n")

          print("Subtitle formatting completed.")
          print("Caption blocks:", len(output))
          PY

      - name: Create five-scene video
        run: |
          set -e

          python - <<'PY'
          import subprocess
          import json

          with open("plan.json", encoding="utf-8") as f:
              plan = json.load(f)

          def duration(path):
              result = subprocess.check_output([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  path
              ], text=True)

              return float(result.strip())

          total = duration("voice.mp3")
          segment = total / len(plan["scenes"])

          files = []

          for i in range(1, 6):
              source = f"scenes/scene{i}.mp4"
              output = f"part{i}.mp4"

              subprocess.run([
                  "ffmpeg", "-y",
                  "-stream_loop", "-1",
                  "-i", source,
                  "-t", str(segment),
                  "-vf",
                  "scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,setsar=1,fps=30",
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  output
              ], check=True)

              files.append(output)

          with open("concat.txt", "w") as f:
              for path in files:
                  f.write(f"file '{path}'\n")

          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat.txt",
              "-c", "copy",
              "joined.mp4"
          ], check=True)

          print("Video scenes joined.")
          print("Voice duration:", round(total, 2))
          PY

          ffmpeg -y \
            -i joined.mp4 \
            -i voice.mp3 \
            -vf "subtitles=captions.srt:force_style='FontName=DejaVu Sans,FontSize=28,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginL=150,MarginR=150,MarginV=300,WrapStyle=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            daily-short.mp4

      - name: Verify output
        run: |
          set -e
          test -s daily-short.mp4

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            daily-short.mp4

          ls -lh daily-short.mp4

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-short
          path: |
            daily-short.mp4
            script.txt
            voice.mp3
            captions.srt
            plan.json
          retention-days: 7
