
name: Daily AI YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install edge-tts requests

      - name: Generate video plan with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          cat > prompt.txt <<'EOF'
          You are an expert YouTube Shorts storyteller and producer.

          Independently choose one fascinating, surprising, accurate
          and emotionally engaging topic for an English YouTube Short.

          Create a professional documentary-style narration.

          Requirements:
          - 55 to 65 spoken English words.
          - A powerful opening hook.
          - Natural conversational English.
          - Calm, meaningful and impactful storytelling.
          - A satisfying ending.
          - No unnecessary introductions.
          - Avoid unsupported claims.

          Create exactly 5 visual scenes in chronological order.

          Each scene must have a specific Pixabay video search query
          matching its corresponding narration.

          Return ONLY valid JSON:

          {
            "title": "Short title",
            "narration": "Complete narration",
            "scenes": [
              {"query": "specific footage search"},
              {"query": "specific footage search"},
              {"query": "specific footage search"},
              {"query": "specific footage search"},
              {"query": "specific footage search"}
            ]
          }
          EOF

          jq -n --rawfile prompt prompt.txt '{
            contents: [{parts: [{text: $prompt}]}],
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.7,
              maxOutputTokens: 4096
            }
          }' > request.json

          curl -fsS \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 180 \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d @request.json \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -o response.json

          python - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          parts = data["candidates"][0]["content"]["parts"]
          result = json.loads("".join(
              p["text"] for p in parts if "text" in p
          ))

          assert len(result["scenes"]) == 5
          assert 55 <= len(result["narration"].split()) <= 65

          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(result["narration"])

          print("Title:", result["title"])
          print("Narration generated successfully")
          PY

      - name: Download relevant Pixabay scenes
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e
          mkdir -p scenes

          python - <<'PY'
          import json
          import os
          import requests
          import time

          with open("plan.json", encoding="utf-8") as f:
              plan = json.load(f)

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0"})

          for i, scene in enumerate(plan["scenes"], 1):
              query = scene["query"]
              print(f"Searching scene {i}: {query}")

              response = session.get(
                  "https://pixabay.com/api/videos/",
                  params={
                      "key": os.environ["PIXABAY_API_KEY"],
                      "q": query,
                      "per_page": 10,
                      "safesearch": "true"
                  },
                  timeout=45
              )
              response.raise_for_status()

              videos = response.json().get("hits", [])
              if not videos:
                  raise RuntimeError(
                      f"No Pixabay video found for: {query}"
                  )

              selected = None

              for video in videos:
                  options = video.get("videos", {})
                  for quality in ("medium", "small", "large"):
                      url = options.get(quality, {}).get("url")
                      if url:
                          selected = url
                          break
                  if selected:
                      break

              if not selected:
                  raise RuntimeError(
                      f"No video URL for scene {i}"
                  )

              output = f"scenes/scene{i}.mp4"
              print("Downloading scene", i)

              with session.get(
                  selected,
                  stream=True,
                  timeout=(30, 180)
              ) as r:
                  r.raise_for_status()
                  with open(output, "wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)

              if os.path.getsize(output) < 10000:
                  raise RuntimeError(
                      f"Downloaded scene {i} is too small"
                  )

              time.sleep(1)

          print("All scenes downloaded successfully")
          PY

      - name: Generate male narration
        run: |
          set -e

          edge-tts \
            --voice en-US-ChristopherNeural \
            --rate=-8% \
            --pitch=-8Hz \
            --file script.txt \
            --write-media voice.mp3 \
            --write-subtitles captions.srt

          test -s voice.mp3
          test -s captions.srt

      - name: Prepare readable subtitles
        run: |
          set -e

          python - <<'PY'
          import re
          import textwrap

          with open("captions.srt", encoding="utf-8") as f:
              content = f.read().strip()

          blocks = re.split(r"\n\s*\n", content)
          output = []

          for block in blocks:
              lines = block.strip().splitlines()

              if len(lines) < 3:
                  continue

              number = lines[0].strip()
              timestamp = lines[1].strip()
              text = " ".join(lines[2:]).strip()

              wrapped = textwrap.wrap(
                  text,
                  width=24,
                  break_long_words=False,
                  break_on_hyphens=False
              )

              output.append(
                  number + "\n" +
                  timestamp + "\n" +
                  "\n".join(wrapped) + "\n"
              )

          if not output:
              raise RuntimeError("Subtitle file is empty")

          with open("captions.srt", "w", encoding="utf-8") as f:
              f.write("\n".join(output))

          print("Subtitle formatting completed")
          PY

      - name: Create five-scene video
        run: |
          set -e

          python - <<'PY'
          import subprocess
          import json

          with open("plan.json", encoding="utf-8") as f:
              plan = json.load(f)

          def duration(path):
              result = subprocess.check_output([
                  "ffprobe", "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  path
              ], text=True)
              return float(result.strip())

          total = duration("voice.mp3")
          segment = total / len(plan["scenes"])

          files = []

          for i in range(1, 6):
              source = f"scenes/scene{i}.mp4"
              output = f"part{i}.mp4"

              subprocess.run([
                  "ffmpeg", "-y",
                  "-stream_loop", "-1",
                  "-i", source,
                  "-t", str(segment),
                  "-vf",
                  "scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,setsar=1,fps=30",
                  "-an",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  output
              ], check=True)

              files.append(output)

          with open("concat.txt", "w") as f:
              for path in files:
                  f.write(f"file '{path}'\n")

          subprocess.run([
              "ffmpeg", "-y",
              "-f", "concat",
              "-safe", "0",
              "-i", "concat.txt",
              "-c", "copy",
              "joined.mp4"
          ], check=True)

          print("Video scenes joined")
          print("Voice duration:", round(total, 2))
          PY

          ffmpeg -y \
            -i joined.mp4 \
            -i voice.mp3 \
            -vf "subtitles=captions.srt:force_style='FontName=DejaVu Sans,FontSize=38,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginL=120,MarginR=120,MarginV=280,WrapStyle=2'" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            daily-short.mp4

      - name: Verify output
        run: |
          set -e
          test -s daily-short.mp4

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            daily-short.mp4

          ls -lh daily-short.mp4

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-short
          path: |
            daily-short.mp4
            script.txt
            voice.mp3
            captions.srt
            plan.json
          retention-days: 7
