
name: Daily YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate English script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          curl -fsS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -d '{
              "contents": [{
                "parts": [{
                  "text": "Choose one fascinating and accurate unusual fact for an English YouTube Shorts audience. Write an original 20-30 second narration with a strong hook and engaging ending. Return only the narration, without title, labels or explanations."
                }]
              }]
            }' > response.json

          python3 - <<'PY'
          import json
          data = json.load(open("response.json", encoding="utf-8"))
          narration = data["candidates"][0]["content"]["parts"][0]["text"].strip()
          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(narration)
          print(narration)
          PY

      - name: Install free text to speech
        run: |
          python3 -m pip install --user edge-tts

      - name: Create English voice
        run: |
          python3 - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              with open("script.txt", encoding="utf-8") as f:
                  text = f.read()

              voice = "en-US-AriaNeural"
              communicate = edge_tts.Communicate(text, voice)
              await communicate.save("voice.mp3")
              print("Voice generated successfully!")

          asyncio.run(main())
          PY

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-audio
          path: |
            script.txt
            voice.mp3
          retention-days: 7
