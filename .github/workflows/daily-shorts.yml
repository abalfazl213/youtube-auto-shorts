
name: Daily YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow edge-tts

      - name: Generate English script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          python - <<'PY'
          import json

          prompt = """
          You are a professional YouTube Shorts creator.

          Independently choose an interesting topic.
          Write a finished English narration for a YouTube Short.

          Requirements:
          - 90 to 110 words.
          - Approximately 40 seconds.
          - Start with a powerful hook.
          - Natural conversational English.
          - Interesting and factually responsible.
          - End with a memorable conclusion.
          - No title, headings, outline, notes or explanations.
          - Do not describe your writing process.
          - Output ONLY the final narration.
          """

          request = {
              "contents": [{
                  "role": "user",
                  "parts": [{"text": prompt}]
              }],
              "generationConfig": {
                  "maxOutputTokens": 1200,
                  "thinkingConfig": {
                      "thinkingLevel": "low"
                  }
              }
          }

          with open("request.json", "w") as f:
              json.dump(request, f)
          PY

          curl --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --retry-max-time 180 \
            --fail-with-body \
            -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d @request.json \
            -o response.json

          python - <<'PY'
          import json
          import sys

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          candidates = data.get("candidates", [])

          if not candidates:
              print("No Gemini candidates returned.")
              print(json.dumps(data, ensure_ascii=False)[:3000])
              sys.exit(1)

          candidate = candidates[0]
          parts = candidate.get("content", {}).get("parts", [])

          texts = [
              p["text"].strip()
              for p in parts
              if p.get("text") and not p.get("thought", False)
          ]

          script = "\n".join(texts).strip()
          words = script.split()

          if len(words) < 50:
              print("Narration is too short.")
              print("Word count:", len(words))
              print("Finish reason:", candidate.get("finishReason"))
              print("Response:", script)
              sys.exit(1)

          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          print("SUCCESS: English script generated.")
          print("Word count:", len(words))
          print(script)
          PY

      - name: Generate AI voice
        run: |
          set -e

          edge-tts \
            --voice en-US-AriaNeural \
            --rate "+5%" \
            --text "$(cat script.txt)" \
            --write-media voice.mp3

          test -s voice.mp3

      - name: Create background and captions
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1080, 1920
          img = Image.new("RGB", (W, H))
          pixels = img.load()

          for y in range(H):
              t = y / H
              color = (
                  int(5 + 8*t),
                  int(12 + 12*t),
                  int(35 + 30*t)
              )
              for x in range(W):
                  pixels[x, y] = color

          draw = ImageDraw.Draw(img)

          for i in range(90):
              x = (i * 137) % W
              y = (i * 251) % H
              r = 2 if i % 3 else 4
              draw.ellipse(
                  (x-r, y-r, x+r, y+r),
                  fill=(130, 150, 190)
              )

          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              75
          )

          title = "DID YOU KNOW?"
          box = draw.textbbox((0, 0), title, font=font)
          tw = box[2] - box[0]

          draw.text(
              ((W-tw)//2, 780),
              title,
              font=font,
              fill=(255, 190, 110)
          )

          img.save("background.png")

          with open("script.txt", encoding="utf-8") as f:
              words = f.read().split()

          chunks = [
              words[i:i+7]
              for i in range(0, len(words), 7)
          ]

          def stamp(seconds):
              h = int(seconds // 3600)
              m = int(seconds % 3600 // 60)
              s = int(seconds % 60)
              ms = int((seconds - int(seconds)) * 1000)
              return f"{h:02}:{m:02}:{s:02},{ms:03}"

          with open("captions.srt", "w", encoding="utf-8") as f:
              for i, chunk in enumerate(chunks):
                  start = i * 45 / len(chunks)
                  end = (i+1) * 45 / len(chunks)

                  f.write(
                      f"{i+1}\n"
                      f"{stamp(start)} --> {stamp(end)}\n"
                      f"{' '.join(chunk)}\n\n"
                  )
          PY

      - name: Render YouTube Short
        run: |
          set -e

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 voice.mp3)

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i background.png \
            -i voice.mp3 \
            -vf "scale=1080:1920,subtitles=captions.srt:force_style='FontName=DejaVu Sans,FontSize=20,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=260'" \
            -t "$DURATION" \
            -r 30 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            daily-short.mp4

          test -s daily-short.mp4

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-short
          path: |
            daily-short.mp4
            script.txt
            voice.mp3
            captions.srt
          retention-days: 7
