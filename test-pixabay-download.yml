
name: Test Pixabay Video Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Search and download video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -e

          curl -fsS --get \
            "https://pixabay.com/api/videos/" \
            --data-urlencode "key=$PIXABAY_API_KEY" \
            --data-urlencode "q=space universe" \
            --data-urlencode "per_page=10" \
            --data-urlencode "safesearch=true" \
            -o pixabay.json

          python - <<'PY'
          import json
          import urllib.request

          with open("pixabay.json") as f:
              data = json.load(f)

          videos = data.get("hits", [])

          if not videos:
              raise SystemExit("No videos found")

          selected = None

          for video in videos:
              options = video.get("videos", {})
              for quality in ["medium", "small", "large"]:
                  url = options.get(quality, {}).get("url")
                  if url:
                      selected = url
                      break
              if selected:
                  break

          if not selected:
              raise SystemExit("No downloadable video URL found")

          print("Downloading video...")

          urllib.request.urlretrieve(selected, "sample.mp4")

          print("Download completed")
          PY

      - name: Check video
        run: |
          ls -lh sample.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            sample.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: pixabay-test-video
          path: sample.mp4
